<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>Stall POS — Street Snacks</title>
<style>
  /* =========================================================
     DESIGN TOKENS
     ========================================================= */
  :root{
    --ink:#0f172a;
    --ink-2:#334155;
    --muted:#64748b;
    --faint:#94a3b8;
    --line:#e4e9f2;
    --line-2:#dbe3ec;
    --indigo:#6366f1;
    --indigo-d:#4f46e5;
    --green:#16a34a;
    --green-d:#15803d;
    --amber:#f59e0b;
    --red:#dc2626;
    --r-xl:22px;
    --r-lg:18px;
    --r-md:14px;
    --r-sm:12px;
    --sh-1:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.06);
    --sh-2:0 6px 24px rgba(15,23,42,.09);
    --sh-3:0 24px 60px rgba(15,23,42,.3);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:#0f172a}
  body{
    height:100%;margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1100px 520px at 50% -18%, #f9fbfd 0%, #eef2f7 55%, #e9eef6 100%);
    color:var(--ink);
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:none;background:none}
  input{font-family:inherit}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* thin, quiet scrollbars */
  .products-wrap,.cart-items,.hlist{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
  .products-wrap::-webkit-scrollbar,
  .cart-items::-webkit-scrollbar,
  .hlist::-webkit-scrollbar{width:8px;height:8px}
  .products-wrap::-webkit-scrollbar-thumb,
  .cart-items::-webkit-scrollbar-thumb,
  .hlist::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
  .products-wrap::-webkit-scrollbar-track,
  .cart-items::-webkit-scrollbar-track,
  .hlist::-webkit-scrollbar-track{background:transparent}

  /* ============ TOP BAR ============ */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    background:linear-gradient(180deg,#16233d 0%,#0f172a 100%);
    color:#fff;flex-wrap:wrap;
    box-shadow:0 2px 14px rgba(15,23,42,.28);
    border-bottom:1px solid rgba(255,255,255,.06);
    z-index:40;
  }
  .brand{font-weight:800;font-size:18px;letter-spacing:.2px;white-space:nowrap}
  .stat{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.09);
    border-radius:var(--r-md);
    padding:5px 13px;line-height:1.15;
    backdrop-filter:blur(4px);
  }
  .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.9px;opacity:.55;font-weight:800}
  .stat-value{font-size:17px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
  .spacer{flex:1}
  .tbtn{
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    color:#fff;border-radius:var(--r-md);
    padding:0 15px;height:46px;
    font-size:15px;font-weight:700;
    transition:background .15s ease, transform .08s ease, border-color .15s ease;
  }
  .tbtn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.24)}
  .tbtn:active{background:rgba(255,255,255,.26);transform:scale(.96)}

  /* ============ MAIN ============ */
  .main{flex:1;display:flex;gap:14px;padding:14px;overflow:hidden;min-height:0}
  .products-wrap{flex:1;overflow-y:auto;min-width:0;padding:2px;-webkit-overflow-scrolling:touch}
  .product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(152px,1fr));
    gap:12px;align-content:start;
  }

  .p-btn{
    position:relative;
    background:linear-gradient(180deg,#ffffff 0%,#fbfcff 100%);
    border:1.5px solid var(--line);
    border-radius:var(--r-lg);
    padding:12px 8px;
    min-height:118px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;font-size:16px;font-weight:700;color:var(--ink);
    overflow:hidden;
    box-shadow:var(--sh-1);
    transition:transform .09s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
  }
  .p-btn:hover{
    border-color:#c7d2fe;
    box-shadow:0 6px 18px rgba(99,102,241,.13);
    transform:translateY(-1px);
  }
  .p-btn:active{
    transform:scale(.955);
    background:linear-gradient(180deg,#eef2ff 0%,#e6ebff 100%);
    border-color:#a5b4fc;
    box-shadow:0 0 0 3px rgba(99,102,241,.14);
  }
  .p-emoji{font-size:26px;line-height:1.15;letter-spacing:-1px;white-space:nowrap}
  .p-name{
    text-align:center;line-height:1.18;font-size:14.5px;font-weight:800;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .p-price{
    font-size:13px;color:#475569;font-weight:800;
    background:#f1f5f9;border:1px solid #e8edf5;
    border-radius:999px;padding:1.5px 9px;margin-top:1px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .p-var{
    font-size:10.5px;font-weight:800;color:#4338ca;
    background:linear-gradient(180deg,#eef2ff,#e0e7ff);
    border:1px solid #c7d2fe;
    border-radius:999px;padding:1px 8px;margin-top:1px;white-space:nowrap;
  }

  /* ============ CART ============ */
  .cart{
    width:400px;flex:0 0 400px;
    background:linear-gradient(180deg,#ffffff 0%,#fdfefe 100%);
    border:1px solid var(--line);
    border-radius:var(--r-xl);
    padding:14px;
    display:flex;flex-direction:column;min-height:0;
    box-shadow:var(--sh-2);
  }
  .cart-grip{display:none}

  .cart-top{
    display:flex;align-items:center;justify-content:space-between;
    font-weight:800;font-size:15px;color:var(--ink-2);
    letter-spacing:.2px;padding:2px 4px 0;
  }
  .pill{
    background:var(--ink);color:#fff;border-radius:999px;
    padding:3px 12px;font-size:13.5px;font-weight:800;
    font-variant-numeric:tabular-nums;
    box-shadow:0 2px 6px rgba(15,23,42,.22);
  }

  .cart-items{
    flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
    margin:12px 0;min-height:0;-webkit-overflow-scrolling:touch;
  }
  .cart-empty{
    color:var(--faint);text-align:center;padding:38px 10px;
    font-size:16px;font-weight:700;line-height:1.5;
  }

  .ci{
    display:flex;align-items:center;gap:9px;
    padding:8px 10px;
    background:linear-gradient(180deg,#fbfcfe,#f6f9fc);
    border:1px solid #e8edf5;
    border-radius:var(--r-md);
    box-shadow:0 1px 2px rgba(15,23,42,.03);
    animation:rowIn .16s ease-out;
  }
  @keyframes rowIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .ci-name{flex:1;min-width:0;font-weight:800;font-size:15.5px;display:flex;flex-direction:column}
  .ci-name span{font-weight:700;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .ci-qty{display:flex;align-items:center;gap:4px}

  .qbtn{
    width:44px;height:44px;border-radius:var(--r-sm);
    border:1px solid var(--line-2);background:#fff;
    font-size:22px;font-weight:800;color:var(--ink);line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(15,23,42,.05);
    transition:background .12s ease, transform .08s ease, border-color .12s ease;
  }
  .qbtn:hover{background:#f8fafc;border-color:#c7d2fe}
  .qbtn:active{background:#eef2ff;border-color:#a5b4fc;transform:scale(.92)}

  .qnum{
    min-width:30px;text-align:center;font-size:19px;font-weight:900;
    font-variant-numeric:tabular-nums;
  }
  .ci-total{
    width:92px;text-align:right;font-weight:900;font-size:15.5px;
    font-variant-numeric:tabular-nums;
  }

  .cart-total-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-weight:800;color:var(--ink-2);font-size:15px;
    border-top:2px dashed var(--line-2);
    margin-top:6px;padding:12px 4px 10px;
  }
  .cart-total-row b{
    font-size:34px;font-weight:900;color:var(--ink);
    letter-spacing:-.8px;font-variant-numeric:tabular-nums;
  }

  .cart-actions{display:flex;gap:10px}

  .btn-clear{
    width:86px;height:72px;border-radius:var(--r-lg);
    background:#fff;border:2px solid var(--line-2);
    font-size:15px;font-weight:800;color:var(--muted);flex:0 0 auto;
    transition:background .14s ease, border-color .14s ease, transform .08s ease;
  }
  .btn-clear:hover{background:#f8fafc;border-color:#cbd5e1;color:var(--ink-2)}
  .btn-clear:active{background:#f1f5f9;transform:scale(.97)}

  .btn-pay{
    flex:1;height:72px;border-radius:var(--r-lg);border:none;color:#fff;
    background:linear-gradient(180deg,#26d366 0%,#16a34a 100%);
    font-size:clamp(18px,2.2vw,24px);font-weight:900;letter-spacing:.2px;
    box-shadow:0 6px 0 var(--green-d), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .08s ease, box-shadow .1s ease, filter .15s ease;
    padding:0 10px;
    font-variant-numeric:tabular-nums;
  }
  .btn-pay:hover:not(:disabled){filter:brightness(1.04)}
  .btn-pay:active:not(:disabled){
    transform:translateY(3px);
    box-shadow:0 3px 0 var(--green-d), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .btn-pay:disabled{
    background:linear-gradient(180deg,#e2e8f0,#d7dee9);
    color:#9aa8bb;box-shadow:none;transform:none;filter:none;
  }

  /* edit-sale banner */
  .edit-banner{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:linear-gradient(180deg,#fff8e6,#fef3c7);
    border:1.5px solid var(--amber);
    border-radius:var(--r-md);
    padding:8px 10px;margin-bottom:10px;
    color:#92400e;font-weight:800;font-size:13.5px;
  }
  .edit-banner-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .edit-banner-cancel{
    height:34px;padding:0 13px;border-radius:10px;border:none;flex:0 0 auto;
    background:var(--amber);color:#fff;font-weight:800;font-size:13px;
    box-shadow:0 2px 0 #d97706;transition:transform .08s ease, background .14s ease;
  }
  .edit-banner-cancel:active{background:#d97706;transform:translateY(1px);box-shadow:0 1px 0 #b45309}

  /* ============ MODALS ============ */
  .backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,.66);
    backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;padding:14px;z-index:50;
  }
  .backdrop.show{display:flex}
  .modal{
    background:#fff;border-radius:var(--r-xl);padding:20px;
    width:100%;max-width:520px;max-height:92dvh;overflow:auto;
    box-shadow:var(--sh-3);
    animation:pop .18s cubic-bezier(.2,.9,.3,1.05);
  }
  .modal.wide{max-width:820px}
  @keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .modal-title{
    font-size:18.5px;font-weight:900;color:var(--ink-2);
    margin-bottom:14px;letter-spacing:.1px;
  }

  .pay-total{
    font-size:46px;font-weight:900;text-align:center;
    letter-spacing:-1.2px;margin:2px 0 16px;
    font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .pay-label{
    font-size:11.5px;font-weight:800;color:var(--faint);
    text-transform:uppercase;letter-spacing:1px;margin-bottom:9px;
  }

  .tender-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .tender-btn{
    padding:16px 8px;border-radius:var(--r-md);
    border:2px solid var(--line-2);background:#fff;
    font-size:16.5px;font-weight:800;color:var(--ink);
    font-variant-numeric:tabular-nums;
    transition:transform .08s ease, border-color .14s ease, background .14s ease, color .14s ease;
  }
  .tender-btn:hover{border-color:#c7d2fe;background:#fbfcff}
  .tender-btn:active{transform:scale(.96)}
  .tender-btn.sel{
    border-color:var(--green);
    background:linear-gradient(180deg,#e7f9ee,#dcfce7);
    color:var(--green-d);
    box-shadow:0 0 0 3px rgba(22,163,74,.14);
  }

  #tenderInput{
    margin-top:10px;width:100%;height:60px;border-radius:var(--r-md);
    border:2px solid var(--line-2);
    font-size:22px;font-weight:800;padding:0 16px;text-align:center;
    font-variant-numeric:tabular-nums;
    transition:border-color .14s ease, box-shadow .14s ease;
    -webkit-user-select:text;user-select:text;
  }
  #tenderInput:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px rgba(99,102,241,.14)}

  .change-box{
    min-height:34px;margin-top:12px;text-align:center;
    font-size:22px;font-weight:900;color:var(--green-d);
    font-variant-numeric:tabular-nums;
  }
  .change-box.bad{color:var(--red)}

  .btn-complete{
    width:100%;height:74px;margin-top:14px;border-radius:var(--r-lg);border:none;color:#fff;
    background:linear-gradient(180deg,#26d366 0%,#16a34a 100%);
    font-size:21px;font-weight:900;letter-spacing:.2px;
    box-shadow:0 6px 0 var(--green-d), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .08s ease, box-shadow .1s ease, filter .15s ease;
    padding:0 10px;
    font-variant-numeric:tabular-nums;
  }
  .btn-complete:hover:not(:disabled){filter:brightness(1.04)}
  .btn-complete:active:not(:disabled){
    transform:translateY(3px);
    box-shadow:0 3px 0 var(--green-d), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .btn-complete:disabled{
    background:linear-gradient(180deg,#e2e8f0,#d7dee9);
    box-shadow:none;color:#9aa8bb;transform:none;filter:none;
  }

  .btn-cancel{
    width:100%;height:56px;margin-top:10px;border-radius:var(--r-md);
    background:#f1f5f9;color:#475569;font-size:16px;font-weight:800;
    transition:background .14s ease, transform .08s ease;
  }
  .btn-cancel:hover{background:#e9eff7}
  .btn-cancel:active{background:#e2e8f0;transform:scale(.985)}

  /* option chooser */
  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt-btn{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:20px 10px;border-radius:var(--r-md);
    border:2px solid var(--line-2);background:#fff;
    font-weight:800;font-size:16.5px;color:var(--ink);
    transition:transform .08s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  .opt-btn:hover{border-color:#c7d2fe;background:#fbfcff;box-shadow:0 4px 14px rgba(99,102,241,.1)}
  .opt-btn:active{transform:scale(.97);background:#eef2ff;border-color:#a5b4fc}
  .ob-price{font-size:13.5px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}

  .big-input{
    width:100%;height:66px;border-radius:var(--r-md);
    border:2px solid var(--line-2);
    font-size:27px;font-weight:900;text-align:center;padding:0 14px;
    font-variant-numeric:tabular-nums;
    transition:border-color .14s ease, box-shadow .14s ease;
    -webkit-user-select:text;user-select:text;
  }
  .big-input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px rgba(99,102,241,.14)}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{
    padding:11px 15px;border-radius:999px;
    border:1.5px solid var(--line);background:#fff;
    font-weight:800;font-size:14.5px;color:var(--ink-2);
    font-variant-numeric:tabular-nums;
    transition:background .14s ease, border-color .14s ease, transform .08s ease;
  }
  .chip:hover{background:#f8fafc;border-color:#c7d2fe}
  .chip:active{background:#eef2ff;border-color:#a5b4fc;transform:scale(.96)}

  /* ============ SALES LOG ============ */
  .hsummary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .hs{
    flex:1;min-width:104px;
    background:linear-gradient(180deg,#fbfcfe,#f5f8fc);
    border:1px solid var(--line);border-top:3px solid #cbd5e1;
    border-radius:var(--r-md);
    padding:10px 12px;display:flex;flex-direction:column;gap:1px;
  }
  .hs:nth-child(1){border-top-color:#6366f1}
  .hs:nth-child(2){border-top-color:#16a34a}
  .hs:nth-child(3){border-top-color:#f59e0b}
  .hs:nth-child(4){border-top-color:#0ea5e9}
  .hs b{font-size:18px;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
  .hs span{font-size:10.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.7px}

  .h-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .h-chip{
    padding:9px 16px;border-radius:999px;
    border:1.5px solid var(--line);background:#fff;
    font-weight:800;font-size:13.5px;color:#475569;
    transition:background .14s ease, color .14s ease, border-color .14s ease, transform .08s ease;
  }
  .h-chip:hover{background:#f8fafc;border-color:#cbd5e1}
  .h-chip:active{transform:scale(.96)}
  .h-chip.on{
    background:linear-gradient(180deg,#1e293b,#0f172a);
    color:#fff;border-color:var(--ink);
    box-shadow:0 3px 10px rgba(15,23,42,.22);
  }
  .h-search{
    flex:1;min-width:140px;height:44px;border-radius:999px;
    border:1.5px solid var(--line);background:#fbfcfe;
    padding:0 18px;font-size:14.5px;font-weight:700;
    -webkit-user-select:text;user-select:text;
    transition:border-color .14s ease, box-shadow .14s ease, background .14s ease;
  }
  .h-search::placeholder{color:#a8b4c6;font-weight:600}
  .h-search:focus{outline:none;border-color:var(--indigo);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.12)}

  .hlist{max-height:50vh;overflow-y:auto;padding-right:4px;-webkit-overflow-scrolling:touch}

  .sl-day-head{
    position:sticky;top:0;z-index:2;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:10px 4px 7px;margin-bottom:8px;
    font-size:11px;font-weight:900;text-transform:uppercase;
    letter-spacing:.9px;color:var(--faint);
    background:#fff;
    border-bottom:1px dashed var(--line);
  }
  .sl-day-head:first-child{padding-top:2px}
  .sl-day-head b{color:var(--ink-2);font-size:15px;letter-spacing:-.2px;text-transform:none;
                 font-variant-numeric:tabular-nums}

  .sl{
    background:#fff;border:1.5px solid var(--line);
    border-radius:var(--r-md);margin-bottom:8px;overflow:hidden;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
    transition:box-shadow .18s ease, border-color .18s ease;
  }
  .sl:hover{box-shadow:0 4px 14px rgba(15,23,42,.07)}
  .sl.open{border-color:#c7d2fe;box-shadow:0 8px 24px rgba(99,102,241,.13)}

  .sl-head{
    display:flex;align-items:center;gap:9px;
    padding:11px 13px;background:#fbfcfe;cursor:pointer;
    transition:background .16s ease;
  }
  .sl-head:hover{background:#f4f7fc}
  .sl.open .sl-head{background:linear-gradient(180deg,#eef2ff,#e7ecff)}
  .sl-time{
    font-size:13.5px;font-weight:900;color:var(--ink-2);
    white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .sl-dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1;flex:0 0 auto;transition:background .16s}
  .sl.open .sl-dot{background:var(--indigo)}
  .sl-preview{
    flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .sl-amt{font-size:16.5px;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
  .sl-caret{font-size:10px;color:var(--faint);transition:transform .2s ease}
  .sl.open .sl-caret{transform:rotate(180deg);color:var(--indigo)}

  .sl-body{display:none;padding:10px 13px 13px;border-top:1px dashed var(--line)}
  .sl.open .sl-body{display:block;animation:fadeSlide .2s ease-out}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

  .sl-line{display:flex;align-items:baseline;gap:10px;padding:6px 0;font-size:14.5px}
  .sl-line + .sl-line{border-top:1px solid #f5f8fc}
  .sl-line .q{font-weight:900;color:var(--indigo-d);min-width:30px;font-size:13.5px;
              font-variant-numeric:tabular-nums}
  .sl-line .n{flex:1;min-width:0;font-weight:700;color:var(--ink-2)}
  .sl-line .p{font-weight:900;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}

  .sl-foot{
    display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;padding-top:10px;
    border-top:1px solid #f1f5f9;font-size:12px;font-weight:700;color:var(--faint);
  }
  .sl-foot b{color:var(--ink);font-variant-numeric:tabular-nums}

  .sl-acts{display:flex;gap:8px;margin-top:12px}
  .sl-acts button{
    flex:1;height:46px;border-radius:var(--r-sm);border:none;
    font-size:13.5px;font-weight:800;
    transition:background .14s ease, transform .08s ease;
  }
  .act-edit{background:#eef2ff;color:var(--indigo-d)}
  .act-edit:hover{background:#e4eaff}
  .act-edit:active{background:#dde5ff;transform:scale(.98)}
  .act-del{background:#fee2e2;color:var(--red)}
  .act-del:hover{background:#fdd8d8}
  .act-del:active{background:#fbcaca;transform:scale(.98)}

  .row-btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .row-btns button{
    flex:1;min-width:110px;height:56px;border-radius:var(--r-md);border:none;
    font-size:15.5px;font-weight:800;
    transition:background .14s ease, transform .08s ease, box-shadow .14s ease;
  }
  .row-btns button:active{transform:scale(.985)}
  .btn-primary{background:linear-gradient(180deg,#1e293b,#0f172a);color:#fff;
               box-shadow:0 4px 12px rgba(15,23,42,.22)}
  .btn-primary:hover{background:linear-gradient(180deg,#26344c,#16213a)}
  .btn-sec{background:#f1f5f9;color:#475569}
  .btn-sec:hover{background:#e9eff7}
  .btn-sec:active{background:#e2e8f0}
  .btn-danger{background:#fee2e2;color:var(--red)}
  .btn-danger:hover{background:#fdd8d8}
  .btn-danger:active{background:#fbcaca}

  .empty{color:var(--faint);text-align:center;padding:34px;font-size:15.5px;font-weight:700;line-height:1.6}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);
    background:linear-gradient(180deg,#1e293b,#0f172a);
    color:#fff;padding:15px 26px;border-radius:var(--r-md);
    font-size:17px;font-weight:800;
    border:1px solid rgba(255,255,255,.12);
    opacity:0;transition:opacity .22s ease, transform .22s ease;
    pointer-events:none;z-index:100;
    box-shadow:0 14px 40px rgba(0,0,0,.34);
    white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* =========================================================
     MOBILE  —  full-screen menu + compact bottom sheet
     ========================================================= */
  @media (max-width:960px){
    .brand{display:none}
    .topbar{gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px}
    .tbtn{padding:0 11px;height:42px;font-size:14px;border-radius:12px}
    .tbtn span{display:none}
    .stat{padding:4px 10px;border-radius:11px}
    .stat-label{font-size:8.5px;letter-spacing:.7px}
    .stat-value{font-size:14px}

    /* reserve the bottom strip for the collapsed cart bar */
    .main{
      flex-direction:column;gap:0;
      padding:6px 6px calc(116px + env(safe-area-inset-bottom));
    }
    .products-wrap{flex:1;min-height:0;overflow:hidden;display:flex;padding:0}
    .product-grid{
      flex:1;min-height:0;
      grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));
      grid-auto-rows:minmax(0,1fr);
      gap:6px;align-content:stretch;
    }
    .p-btn{
      min-height:0;height:100%;padding:4px 3px;
      border-radius:13px;border-width:1.5px;gap:2px;
      box-shadow:0 1px 2px rgba(15,23,42,.05);
    }
    .p-emoji{font-size:clamp(17px,5.4vw,27px);line-height:1.05}
    .p-name{font-size:clamp(10.5px,2.95vw,14px);line-height:1.12;-webkit-line-clamp:3;line-clamp:3}
    .p-price{font-size:clamp(9.5px,2.6vw,12.5px);padding:1px 7px}
    .p-var{font-size:8.5px;padding:0 5px}

    /* -------- cart becomes a bottom sheet -------- */
    .cart{
      position:fixed;left:0;right:0;bottom:0;z-index:30;
      width:auto;flex:none;
      max-height:78dvh;
      border:1px solid var(--line);
      border-bottom:none;
      border-radius:24px 24px 0 0;
      padding:0 12px calc(9px + env(safe-area-inset-bottom));
      background:linear-gradient(180deg,#ffffff 0%,#fdfefe 100%);
      box-shadow:0 -10px 34px rgba(15,23,42,.18);
      display:flex;flex-direction:column;
    }

    .cart-grip{
      position:relative;
      display:flex;align-items:center;gap:8px;width:100%;
      height:44px;padding:12px 2px 0;
      background:none;border:none;
      font-size:13.5px;font-weight:900;color:#475569;
      text-align:left;
    }
    .cart-grip::before{
      content:'';
      position:absolute;top:6px;left:50%;transform:translateX(-50%);
      width:40px;height:4px;border-radius:999px;background:#d5dde8;
    }
    .cart-grip .grip-icon{font-size:15px;line-height:1}
    .cart-grip .grip-text{
      flex:1;min-width:0;text-align:left;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      color:#64748b;
    }
    .cart-grip .grip-total{
      color:var(--ink);font-size:16px;font-weight:900;
      font-variant-numeric:tabular-nums;
    }
    .cart-grip .grip-caret{font-size:10px;color:var(--faint);transition:transform .2s ease}
    .cart.expanded .cart-grip .grip-caret{transform:rotate(180deg);color:var(--indigo)}

    .grip-total.bump{animation:bump .3s cubic-bezier(.2,.9,.3,1.2)}
    @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18);color:var(--green-d)}100%{transform:scale(1)}}

    .cart-top{display:none}

    .cart-items{display:none}
    .cart.expanded .cart-items{
      display:flex;margin:2px 0 6px;
      max-height:38dvh;overflow-y:auto;padding-right:2px;
      animation:fadeSlide .2s ease-out;
    }

    .cart-total-row{display:none;border-top:2px dashed var(--line-2);padding:9px 4px 7px;margin-top:0}
    .cart.expanded .cart-total-row{display:flex;animation:fadeSlide .2s ease-out}
    .cart-total-row b{font-size:26px}

    .cart-actions{gap:8px;padding-top:6px}
    .btn-clear{width:68px;height:52px;border-radius:14px;font-size:13px;border-width:1.5px}
    .btn-pay{height:52px;border-radius:14px;font-size:18.5px;box-shadow:0 4px 0 var(--green-d), inset 0 1px 0 rgba(255,255,255,.28)}
    .btn-pay:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--green-d), inset 0 1px 0 rgba(255,255,255,.28)}

    .edit-banner{font-size:12.5px;padding:6px 9px;margin:8px 0 0}
    .edit-banner-cancel{height:32px;font-size:12px}

    .ci{padding:6px 8px;border-radius:12px}
    .ci-name{font-size:14.5px}
    .qbtn{width:42px;height:42px;border-radius:11px}
    .qnum{font-size:18px;min-width:26px}
    .ci-total{width:80px;font-size:14.5px}

    /* -------- modals slide up as sheets -------- */
    .backdrop{align-items:flex-end;padding:0}
    .modal{
      border-radius:24px 24px 0 0;
      padding:18px 16px calc(18px + env(safe-area-inset-bottom));
      max-height:92dvh;
      animation:sheetUp .22s cubic-bezier(.2,.9,.3,1.02);
    }
    @keyframes sheetUp{from{transform:translateY(26px);opacity:.4}to{transform:translateY(0);opacity:1}}

    .pay-total{font-size:38px}
    .tender-btn{padding:15px 8px;font-size:15.5px}
    .btn-complete{height:66px;font-size:19px;margin-top:12px}
    .btn-cancel{height:52px}

    .hsummary{gap:8px;margin-bottom:12px}
    .hs{min-width:calc(50% - 4px);padding:9px 11px}
    .hs b{font-size:16px}
    .hs span{font-size:10px}
    .hlist{max-height:44vh}
    .sl-head{padding:10px 11px;gap:8px}
    .sl-time{font-size:13px}
    .sl-preview{font-size:12px}
    .sl-amt{font-size:15.5px}
    .sl-body{padding:9px 11px 12px}
    .sl-acts button{height:44px;font-size:13px}
    .row-btns button{height:52px;font-size:15px}
    .h-chip{padding:8px 14px;font-size:13px}
    .h-search{height:42px;font-size:14px}
  }

  /* very short screens (landscape phones) — let the grid scroll a bit */
  @media (max-width:960px) and (max-height:520px){
    .main{padding-bottom:calc(98px + env(safe-area-inset-bottom))}
    .products-wrap{overflow-y:auto}
    .product-grid{grid-auto-rows:minmax(74px,1fr);align-content:start}
    .cart-grip{height:38px;padding-top:10px}
    .cart-grip::before{top:4px;height:3px;width:34px}
    .btn-clear,.btn-pay{height:46px}
  }

  @media (max-width:480px){
    .opt-grid{grid-template-columns:1fr}
    .modal{padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  }

  /* respect reduced-motion */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>

<body>

<div class="app">

    </div>
    <div class="stat">
      <div class="stat-label">Orders</div>

    </div>

    <button class="tbtn" id="btnHistory" title="Sales log">📋<span>Sales log</span></button>

<!-- ================= ITEM OPTIONS MODAL ================= -->
<div class="backdrop" id="optModal">

    <div class="hsummary" id="historySummary"></div>

      <button class="h-chip on" data-f="today">Today</button>

      <input class="h-search" id="hSearch" placeholder="Search item or amount…">
    </div>

    <div class="hlist" id="historyList"></div>

    <div class="row-btns">
      <button class="btn-sec" id="btnHistoryExport">💾 Export</button>
      <button class="btn-danger" id="btnClearAll">🗑 Clear all</button>
      <button class="btn-primary" id="btnHistoryClose">Close</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   Stall POS — single-file point of sale
   Fixed menu · mobile-first layout · enhanced sales log
   ========================================================= */

/* ---------- storage ---------- */
const K_SALES = 'stallpos.sales.v1';

function loadJSON(key, def){
  try{
    const raw = localStorage.getItem(key);
    if(raw === null) return def;
    const v = JSON.parse(raw);
    return (v === null || v === undefined) ? def : v;
  }catch(e){ return def; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ alert('Could not save data.\n' + e.message); }
}

/* ---------- helpers ---------- */
const $    = id => document.getElementById(id);
const esc  = s => String(s === undefined || s === null ? '' : s)
                   .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2   = n => Math.round((Number(n) || 0) * 100) / 100;
const pad  = n => String(n).padStart(2, '0');
const dayKey = d => { const x = new Date(d);
                      return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); };
const todayKey = () => dayKey(new Date());

/* ---------- 12-hour time & friendly date labels ---------- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtTime12(d){
  let h = d.getHours();
  const m = pad(d.getMinutes());
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return h + ':' + m + ' ' + ampm;
}
function fmtDateOnly(d){
  const dd = new Date(d);
  const now = new Date();
  const y = dd.getFullYear() === now.getFullYear() ? '' : ' ' + dd.getFullYear();
  return dd.getDate() + ' ' + MONTHS[dd.getMonth()] + y;
}
function fmtDayLabel(d){
  const now  = new Date();
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  const k = dayKey(d);
  if(k === dayKey(now))  return 'Today';
  if(k === dayKey(yest)) return 'Yesterday';
  return fmtDateOnly(d);
}
function fmtWhen(d){
  return fmtDayLabel(d) + ' · ' + fmtTime12(d);
}

/* =========================================================
   FIXED MENU  (edit the numbers here if prices ever change)
   ========================================================= */
const CURRENCY = 'Ks';

const MENU = [
  { id:'m01', emoji:'🍚🍛🍳', name:'Spicy Omelette',
    variants:[{label:'Regular', price:10000}, {label:'Large', price:15000}] },

  { id:'m02', emoji:'🌽🧀',   name:'Corn Cheese',              price:6000 },
  { id:'m03', emoji:'🍙🥬',   name:'Seaweed Rice Roll',        price:4000 },
  { id:'m04', emoji:'🌶️🍙🥬', name:'Spicy Seaweed Rice Roll',  price:5000 },
  { id:'m05', emoji:'🥪',     name:'Fried Sandwich',           price:5000 },
  { id:'m06', emoji:'🍟🥔',   name:'Fried Potato (Fries)',     price:5000 },
  { id:'m07', emoji:'🌶️🍠🥔', name:'Malar Fried Potato',       price:5500 },

  /* both styles cost the same → single fixed-price item */
  { id:'m08', emoji:'🍝',     name:'Spicy Noodles',            price:4000 },

  { id:'m09', emoji:'🍹',     name:'Juice',                    price:3500 },
  { id:'m10', emoji:'🍹🥤',   name:'Juice + Soda',             price:4000 },
  { id:'m11', emoji:'🍹🪼',   name:'Juice + Jelly',            price:4000 },

  { id:'m12', emoji:'🐟🍥',   name:'Fish Cake (1 pc)',         price:1500 },
  { id:'m13', emoji:'💧🚰',   name:'Chilled Water Bottle',     price:1500 },
  { id:'m14', emoji:'☕❄️',   name:'Ice Coffee',               price:3000 },
  { id:'m15', emoji:'☕♨️',   name:'Hot Coffee',               price:2000 },

  /* price entered at the counter each time */
  { id:'m16', emoji:'🍥🍢🍤', name:'အကင်စုံ (Sea Foods)',      open:true }
];

/* ---------- state ---------- */
let sales = loadJSON(K_SALES, []) || [];
let cart  = [];               // { key, name, price, qty }
let editingSaleId = null;
let pay   = { total: 0, tendered: 0, done: false };

/* sales-log view state */
let hFilter   = 'today';
let hSearch   = '';
const openSales = new Set();

/* ---------- money ---------- */
function money(n){
  n = r2(n);
  const s = Number.isInteger(n) ? n.toLocaleString('en-US') : n.toFixed(2);
  return (CURRENCY ? CURRENCY + ' ' : '') + s;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- mobile helpers ---------- */
const cartPanel = $('cartPanel');
const mqMobile  = window.matchMedia('(max-width: 960px)');
const isMobile  = () => mqMobile.matches;

function bumpGrip(){
  const g = $('gripTotal');
  g.classList.remove('bump');
  void g.offsetWidth;
  g.classList.add('bump');
}

/* =========================================================
   PRODUCT GRID
   ========================================================= */
function priceLabel(p){
  if(p.open) return 'Set price';
  if(p.variants){
    const ps = p.variants.map(v => v.price);
    const mn = Math.min.apply(null, ps), mx = Math.max.apply(null, ps);
    return mn === mx ? money(mn) : money(mn) + ' – ' + money(mx);
  }
  return money(p.price);
}

function renderProducts(){
  const g = $('productGrid');

  /* fit every item on one screen: square-ish grid */
  const cols = Math.max(2, Math.min(5, Math.ceil(Math.sqrt(MENU.length))));
  g.style.setProperty('--cols', cols);

  g.innerHTML = '';
  MENU.forEach(p => {
    const b = document.createElement('button');
    b.className = 'p-btn';
    b.innerHTML =
      '<span class="p-emoji">' + esc(p.emoji || '🍽️') + '</span>' +
      '<span class="p-name">'  + esc(p.name) + '</span>' +
      '<span class="p-price">' + priceLabel(p) + '</span>' +
      (p.variants ? '<span class="p-var">' + p.variants.length + ' options</span>' : '') +
      (p.open ? '<span class="p-var">ask counter</span>' : '');
    b.addEventListener('click', () => {
      if(p.variants || p.open) openOptions(p);
      else addToCart(p, '', p.price);
    });
    g.appendChild(b);
  });
}

/* =========================================================
   ITEM OPTIONS (variants / manual price)
   ========================================================= */
function openOptions(p){
  $('optTitle').textContent = (p.emoji ? p.emoji + '  ' : '') + p.name;
  const body = $('optBody');
  body.innerHTML = '';

  if(p.variants && p.variants.length){
    const grid = document.createElement('div');
    grid.className = 'opt-grid';
    p.variants.forEach(v => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.innerHTML = '<span>' + esc(v.label) + '</span>' +
                    '<span class="ob-price">' + money(v.price) + '</span>';
      b.addEventListener('click', () => {
        addToCart(p, v.label, v.price);
        closeOptions();
      });
      grid.appendChild(b);
    });
    body.appendChild(grid);
  } else {
    body.innerHTML =
      '<div class="pay-label">Enter the price</div>' +
      '<input id="openPrice" class="big-input" type="number" inputmode="decimal" placeholder="0">' +
      '<div class="chip-row" id="openChips"></div>' +
      '<button class="btn-complete" id="openAdd" style="margin-top:14px">ADD TO ORDER</button>';

    const chips = [500, 1000, 1500, 2000, 3000, 5000, 10000];
    const row   = body.querySelector('#openChips');
    const input = body.querySelector('#openPrice');

    chips.forEach(v => {
      const c = document.createElement('button');
      c.className = 'chip';
      c.textContent = money(v);
      c.addEventListener('click', () => { input.value = v; input.focus(); });
      row.appendChild(c);
    });

    const add = () => {
      const v = r2(parseFloat(input.value));
      if(!isFinite(v) || v <= 0){ toast('Enter a price first'); input.focus(); return; }
      addToCart(p, '', v);
      closeOptions();
    };
    body.querySelector('#openAdd').addEventListener('click', add);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') add(); });
    setTimeout(() => input.focus(), 60);
  }

  $('optModal').classList.add('show');
}
function closeOptions(){
  $('optModal').classList.remove('show');
}

/* =========================================================
   CART
   ========================================================= */
function addToCart(p, label, price){
  const fullName = p.name + (label ? ' · ' + label : '');
  const key = p.id + '|' + (label || '') + '|' + price;
  let found = cart.find(c => c.key === key);
  /* merge with a recalled line that has the same name & price */
  if(!found) found = cart.find(c => c.name === fullName && c.price === price);
  if(found) found.qty++;
  else cart.push({ key, name: fullName, price: price, qty: 1 });
  renderCart();
  bumpGrip();
}

function cartTotal(){ return r2(cart.reduce((s, i) => s + i.price * i.qty, 0)); }
function cartQty(){   return cart.reduce((s, i) => s + i.qty, 0); }

function renderCart(){
  /* ---------- edit banner ---------- */
  const banner = $('editBanner');
  if(editingSaleId){
    const orig = sales.find(s => s.id === editingSaleId);
    const whenStr = orig ? fmtWhen(new Date(orig.ts)) : '?';
    banner.style.display = 'flex';
    banner.innerHTML =
      '<span class="edit-banner-text">✏️ Editing order from ' + whenStr + '</span>' +
      '<button class="edit-banner-cancel" type="button">Cancel</button>';
    banner.querySelector('.edit-banner-cancel').addEventListener('click', cancelEdit);
  } else {
    banner.style.display = 'none';
    banner.innerHTML = '';
  }

  /* ---------- items ---------- */
  const wrap = $('cartItems');
  wrap.innerHTML = '';

  if(!cart.length){
    wrap.innerHTML = '<div class="cart-empty">👈 Tap an item to start</div>';
  } else {
    cart.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'ci';
      row.innerHTML =
        '<div class="ci-name">' + esc(it.name) +
          '<span>' + money(it.price) + ' each</span></div>' +
        '<div class="ci-qty">' +
          '<button class="qbtn" data-a="minus">−</button>' +
          '<span class="qnum">' + it.qty + '</span>' +
          '<button class="qbtn" data-a="plus">+</button>' +
        '</div>' +
        '<div class="ci-total">' + money(it.price * it.qty) + '</div>';

      row.querySelector('[data-a="minus"]').addEventListener('click', () => {
        it.qty--;
        if(it.qty <= 0) cart.splice(i, 1);
        renderCart();
      });
      row.querySelector('[data-a="plus"]').addEventListener('click', () => {
        it.qty++;
        renderCart();
      });
      wrap.appendChild(row);
    });
  }

  /* ---------- totals & labels ---------- */
  const total = cartTotal();
  const qty   = cartQty();

  $('totalText').textContent = money(total);
  $('cartCount').textContent = qty;
  $('gripTotal').textContent = money(total);
  $('gripText').textContent  = cart.length
    ? qty + (qty === 1 ? ' item' : ' items')
    : (editingSaleId ? 'Editing order' : 'No items yet');

  const payBtn = $('btnPay');
  payBtn.disabled = cart.length === 0;
  payBtn.textContent = editingSaleId
    ? (cart.length ? 'UPDATE  ' + money(total) : 'UPDATE')
    : (cart.length ? 'PAY  ' + money(total) : 'PAY');

  /* keep the sheet tidy */
  if(!cart.length && !editingSaleId) cartPanel.classList.remove('expanded');
}

/* ---------- mobile sheet toggle ---------- */
$('cartGrip').addEventListener('click', () => {
  if(!cart.length && !editingSaleId) return;
  cartPanel.classList.toggle('expanded');
});

/* =========================================================
   STATS
   ========================================================= */
function renderStats(){
  const now = new Date();
  const t   = dayKey(now);
  let sum = 0, count = 0;
  sales.forEach(s => {
    if(dayKey(s.ts) === t){ sum += (s.total || 0); count++; }
  });
  $('statToday').textContent     = money(sum);
  $('statCount').textContent     = count;
  $('statDateLabel').textContent = fmtDateOnly(now);
}

/* =========================================================
   PAY FLOW
   ========================================================= */
function niceTenders(total){
  const NOTES = [1000, 5000, 10000];
  const out = [];

  for(const d of NOTES){
    const v = (Math.floor(total / d) + 1) * d;
    if(out.indexOf(v) === -1) out.push(v);
  }
  if(out.length < 3){
    const sums = [];
    for(const a of NOTES) for(const b of NOTES) sums.push(a + b);
    for(const c of NOTES) sums.push(c * 3);
    sums.sort((a, b) => a - b);
    for(const v of sums){
      if(v > total && out.indexOf(v) === -1){
        out.push(v);
        if(out.length >= 3) break;
      }
    }
  }
  return out.sort((a, b) => a - b).slice(0, 3);
}

function openPay(){
  if(!cart.length) return;
  pay.total = cartTotal();

  if(editingSaleId){
    const orig = sales.find(s => s.id === editingSaleId);
    pay.tendered = (orig && orig.tendered >= pay.total) ? orig.tendered : pay.total;
    $('payTitle').textContent = '✏️ Update order';
  } else {
    pay.tendered = pay.total;
    $('payTitle').textContent = '💵 Payment';
  }

  pay.done = false;
  $('payTotal').textContent = money(pay.total);
  $('tenderInput').value = '';
  renderTenders();
  $('payModal').classList.add('show');
}

function renderTenders(){
  const grid = $('tenderGrid');
  grid.innerHTML = '';
  const opts = [{ label: 'Exact', value: pay.total }];
  niceTenders(pay.total).forEach(v => opts.push({ label: money(v), value: v }));

  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'tender-btn' + (Math.abs(o.value - pay.tendered) < 0.005 ? ' sel' : '');
    b.textContent = o.label;
    b.addEventListener('click', () => {
      pay.tendered = o.value;
      $('tenderInput').value = '';
      renderTenders();
    });
    grid.appendChild(b);
  });
  updateChange();
}

function updateChange(){
  const diff = r2(pay.tendered - pay.total);
  const box  = $('changeBox');
  const btn  = $('btnComplete');

  if(diff < -0.005){
    box.textContent = 'Short by ' + money(Math.abs(diff));
    box.className = 'change-box bad';
    btn.disabled = true;
  } else if(diff > 0.005){
    box.textContent = 'Change: ' + money(diff);
    box.className = 'change-box';
    btn.disabled = false;
  } else {
    box.textContent = '';
    box.className = 'change-box';
    btn.disabled = false;
  }
  btn.textContent = (editingSaleId ? '✅ UPDATE — ' : '✅ COMPLETE — ') + money(pay.total);
}

function completeSale(){
  if(pay.done) return;
  if(pay.tendered < pay.total - 0.005) return;
  if(!cart.length) return;

  pay.done = true;

  const items    = cart.map(c => ({ name: c.name, price: c.price, qty: c.qty }));
  const total    = r2(pay.total);
  const tendered = r2(pay.tendered);
  const change   = r2(pay.tendered - pay.total);

  let message;

  if(editingSaleId){
    const idx = sales.findIndex(s => s.id === editingSaleId);
    if(idx === -1){
      sales.push({ id: uid(), ts: new Date().toISOString(), items, total, tendered, change });
      message = 'Original not found — saved as new ✓';
    } else {
      sales[idx] = Object.assign({}, sales[idx], {
        items, total, tendered, change,
        editedAt: new Date().toISOString()
      });
      message = 'Order updated ✓  ' + money(total);
    }
    editingSaleId = null;
  } else {
    sales.push({ id: uid(), ts: new Date().toISOString(), items, total, tendered, change });
    message = 'Saved ✓  ' + money(total);
  }

  saveJSON(K_SALES, sales);
  cart = [];
  $('payModal').classList.remove('show');
  cartPanel.classList.remove('expanded');
  renderCart();
  renderStats();
  toast(message);
}

/* =========================================================
   RECALL / EDIT
   ========================================================= */
function recallSale(sale){
  if(editingSaleId && editingSaleId !== sale.id){
    if(!confirm('Discard the current edit and load this order instead?')) return;
  }
  cart = (sale.items || []).map((it, idx) => ({
    key:   'rec-' + sale.id + '-' + idx,
    name:  it.name,
    price: it.price,
    qty:   it.qty
  }));
  editingSaleId = sale.id;
  $('historyModal').classList.remove('show');
  renderCart();
  if(isMobile()) cartPanel.classList.add('expanded');
  toast('Editing order — tap UPDATE to save');
}

function cancelEdit(){
  if(!confirm('Discard your changes to this order?')) return;
  editingSaleId = null;
  cart = [];
  cartPanel.classList.remove('expanded');
  renderCart();
}

function deleteSale(sale){
  const items = (sale.items || []).map(i => i.qty + '× ' + i.name).join(', ');
  if(!confirm('Delete this order?\n' + money(sale.total) + '\n' + items)) return;
  sales = sales.filter(x => x.id !== sale.id);
  if(editingSaleId === sale.id){
    editingSaleId = null;
    cart = [];
    cartPanel.classList.remove('expanded');
    renderCart();
  }
  openSales.delete(sale.id);
  saveJSON(K_SALES, sales);
  renderHistory();
  renderStats();
  toast('Order deleted');
}

/* =========================================================
   SALES LOG
   ========================================================= */
function openHistory(){
  renderHistory();
  $('historyModal').classList.add('show');
}

function hsCard(value, label){
  return '<div class="hs"><b>' + value + '</b><span>' + label + '</span></div>';
}

function itemQty(s){
  return (s.items || []).reduce((a, i) => a + (i.qty || 0), 0);
}

function renderHistory(){
  const tKey    = todayKey();
  const yKey    = dayKey(new Date(Date.now() - 864e5));
  const weekAgo = Date.now() - 7 * 864e5;

  /* ---- filter ---- */
  let arr = sales.slice();
  if(hFilter === 'today')      arr = arr.filter(s => dayKey(s.ts) === tKey);
  else if(hFilter === 'yest')  arr = arr.filter(s => dayKey(s.ts) === yKey);
  else if(hFilter === 'week')  arr = arr.filter(s => new Date(s.ts).getTime() >= weekAgo);

  /* ---- search ---- */
  const q = hSearch.trim().toLowerCase();
  if(q){
    arr = arr.filter(s => {
      if(String(s.total).indexOf(q) !== -1) return true;
      if(money(s.total).toLowerCase().indexOf(q) !== -1) return true;
      return (s.items || []).some(i => String(i.name).toLowerCase().indexOf(q) !== -1);
    });
  }

  arr.sort((a, b) => new Date(b.ts) - new Date(a.ts));

  /* ---- summary ---- */
  const total = arr.reduce((s, x) => s + (x.total || 0), 0);
  const items = arr.reduce((s, x) => s + itemQty(x), 0);
  const avg   = arr.length ? total / arr.length : 0;

  $('historySummary').innerHTML =
    hsCard(arr.length, 'orders') +
    hsCard(money(total), 'total') +
    hsCard(money(avg), 'avg order') +
    hsCard(items, 'items sold');

  /* ---- list ---- */
  const list = $('historyList');
  list.innerHTML = '';

  if(!arr.length){
    list.innerHTML = '<div class="empty">No orders match this view.</div>';
    return;
  }

  /* group by day */
  const groups = [];
  const byDay  = {};
  arr.forEach(s => {
    const k = dayKey(s.ts);
    if(!byDay[k]){ byDay[k] = { key: k, ts: s.ts, sales: [] }; groups.push(byDay[k]); }
    byDay[k].sales.push(s);
  });

  groups.forEach(g => {
    const gTotal = g.sales.reduce((s, x) => s + (x.total || 0), 0);
    const gQty   = g.sales.reduce((s, x) => s + itemQty(x), 0);

    const head = document.createElement('div');
    head.className = 'sl-day-head';
    head.innerHTML =
      '<span>' + fmtDayLabel(g.ts) + ' · ' + g.sales.length + ' order' +
        (g.sales.length === 1 ? '' : 's') + ' · ' + gQty + ' items</span>' +
      '<b>' + money(gTotal) + '</b>';
    list.appendChild(head);

    g.sales.forEach(s => list.appendChild(saleRow(s)));
  });
}

function saleRow(s){
  const d       = new Date(s.ts);
  const isOpen  = openSales.has(s.id);
  const items   = s.items || [];
  const preview = items.map(i => i.qty + '× ' + i.name).join('  ·  ');

  const el = document.createElement('div');
  el.className = 'sl' + (isOpen ? ' open' : '');

  el.innerHTML =
    '<div class="sl-head">' +
      '<span class="sl-time">' + fmtTime12(d) + '</span>' +
      '<span class="sl-dot"></span>' +
      '<span class="sl-preview">' + esc(preview) + '</span>' +
      '<span class="sl-amt">' + money(s.total) + '</span>' +
      '<span class="sl-caret">▼</span>' +
    '</div>' +
    '<div class="sl-body">' +
      items.map(i =>
        '<div class="sl-line">' +
          '<span class="q">' + i.qty + '×</span>' +
          '<span class="n">' + esc(i.name) + '</span>' +
          '<span class="p">' + money(i.price * i.qty) + '</span>' +
        '</div>'
      ).join('') +
      '<div class="sl-foot">' +
        '<span>Paid <b>' + money(s.tendered === undefined ? s.total : s.tendered) + '</b></span>' +
        '<span>Change <b>' + money(s.change || 0) + '</b></span>' +
        (s.editedAt ? '<span>Edited <b>' + fmtWhen(new Date(s.editedAt)) + '</b></span>' : '') +
        '<span>#<b>' + esc(String(s.id).slice(-6)) + '</b></span>' +
      '</div>' +
      '<div class="sl-acts">' +
        '<button class="act-edit">✏️ Edit order</button>' +
        '<button class="act-del">🗑 Delete</button>' +
      '</div>' +
    '</div>';

  el.querySelector('.sl-head').addEventListener('click', () => {
    if(openSales.has(s.id)) openSales.delete(s.id);
    else openSales.add(s.id);
    el.classList.toggle('open');
  });
  el.querySelector('.act-edit').addEventListener('click', () => recallSale(s));
  el.querySelector('.act-del').addEventListener('click',  () => deleteSale(s));

  return el;
}

/* =========================================================
   EXPORT / IMPORT
   ========================================================= */
function exportData(){
  const data = {
    app: 'stall-pos',
    version: 2,
    exportedAt: new Date().toISOString(),
    currency: CURRENCY,
    sales: sales
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'stall-sales-' + todayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('Exported ' + sales.length + ' order(s)');
}

function handleImport(data){
  if(!data || typeof data !== 'object'){ alert('Invalid file.'); return; }

  const incoming = Array.isArray(data) ? data : (data.sales || []);
  const valid = incoming.filter(s =>
    s && typeof s === 'object' && Array.isArray(s.items) && typeof s.total === 'number');

  const existingIds = new Set(sales.map(s => s.id));
  const fresh = valid
    .map(s => Object.assign({}, s, { id: s.id || uid() }))
    .filter(s => !existingIds.has(s.id));

  if(!fresh.length){ alert('No new orders found in this file.'); return; }

  if(!confirm('Import ' + fresh.length + ' order(s)?\n(Duplicates are skipped automatically.)')) return;

  sales = sales.concat(fresh);
  saveJSON(K_SALES, sales);
  renderStats();
  renderHistory();
  toast('Import complete ✓');
}

/* =========================================================
   EVENT WIRING
   ========================================================= */
$('btnPay').addEventListener('click', openPay);

$('btnClear').addEventListener('click', () => {
  if(editingSaleId){ cancelEdit(); return; }
  if(!cart.length) return;
  if(!confirm('Clear the current order?')) return;
  cart = [];
  cartPanel.classList.remove('expanded');
  renderCart();
});

$('btnPayCancel').addEventListener('click', () => $('payModal').classList.remove('show'));
$('btnComplete').addEventListener('click', completeSale);

$('tenderInput').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  pay.tendered = isFinite(v) ? v : 0;
  Array.prototype.forEach.call($('tenderGrid').children, b => b.classList.remove('sel'));
  updateChange();
});

/* options modal */
$('optCancel').addEventListener('click', closeOptions);

/* sales log */
$('btnHistory').addEventListener('click', openHistory);
$('btnHistoryClose').addEventListener('click', () => $('historyModal').classList.remove('show'));
$('btnHistoryExport').addEventListener('click', exportData);

document.querySelectorAll('.h-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.h-chip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    hFilter = chip.dataset.f;
    renderHistory();
  });
});

$('hSearch').addEventListener('input', e => {
  hSearch = e.target.value;
  renderHistory();
});

$('btnClearAll').addEventListener('click', () => {
  if(!sales.length) return;
  if(!confirm('Delete ALL ' + sales.length + ' orders?\nThis cannot be undone.\n\nTip: export first!')) return;
  sales = [];
  editingSaleId = null;
  cart = [];
  openSales.clear();
  cartPanel.classList.remove('expanded');
  renderCart();
  saveJSON(K_SALES, sales);
  renderHistory();
  renderStats();
  toast('All orders cleared');
});

/* export / import */
$('btnExport').addEventListener('click', exportData);
$('btnImport').addEventListener('click', () => $('fileInput').click());

$('fileInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      handleImport(JSON.parse(reader.result));
    }catch(err){
      alert('That file is not valid JSON.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* close modal when clicking the dark backdrop */
['optModal', 'payModal', 'historyModal'].forEach(id => {
  $(id).addEventListener('click', e => {
    if(e.target === $(id)) $(id).classList.remove('show');
  });
});

/* Esc closes topmost modal */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    document.querySelectorAll('.backdrop.show').forEach(b => b.classList.remove('show'));
  }
});

/* =========================================================
   START
   ========================================================= */
renderProducts();
renderCart();
renderStats();
</script>
